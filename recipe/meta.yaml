{% set name = "r-h2o" %}
{% set version = "3.46.0.7" %}
{% set posix = "m2-" if win else "" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://h2o-release.s3.amazonaws.com/h2o/rel-{{ version.split(".")[:-1] | join(".") }}/{{ version.split(".")[-1] }}/h2o-{{ version }}.zip
  sha256: a7ceeb7e563dd21112e53dc4798b94f2119aac5874e8f2ab6e1b96699cf810ec

build:
  number: 0
  skip: true # [aarch64 or arm64]
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip  # [win]
  host:
    - libcurl {{ libcurl }}
    - r-base
    - r-codetools
    - r-rcurl
    - r-jsonlite
    - openjdk <18
  run:
    - r-base
    - r-rcurl
    - r-jsonlite
    - r-statmod  # [with_statmod == "true" and not win]
    - openjdk <18

test:
  commands:
    - $R -e "library(h2o)"  # [not win]
    - "\"%R%\" -e \"library(h2o)\""  # [win]

about:
  home: https://h2o.ai/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: R Interface for H2O
  description: R interface for H2O, the scalable open source machine learning platform.
  dev_url: https://github.com/h2oai/h2o-3
  doc_url: https://docs.h2o.ai/

extra:
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/125283
  recipe-maintainers:
    - anaconda-services
